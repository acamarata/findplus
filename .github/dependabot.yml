version: 2
updates:
  - package-ecosystem: pip
    directory: "/cli"
    schedule: {interval: weekly}
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/desktop/src-tauri"
    schedule: {interval: weekly}
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: monthly}
