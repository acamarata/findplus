[project]
name = "findplus"
version = "1.0.0.dev0"
description = "Find+: local location history, places, groups and alerts for Google Find Hub and Apple Find My trackers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
license-files = ["LICENSE"]
keywords = ["location","tracking","find-hub","find-my","gps","privacy","sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]

dependencies = [
  # --- our stack ---
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "click>=8.1",
  "structlog>=24.4",
  "python-dotenv>=1.0",
  "tzlocal>=5.2",
  # --- GoogleFindMyTools runtime deps (frida intentionally EXCLUDED: unused upstream) ---
  "undetected-chromedriver>=3.5.5",
  "selenium>=4.27.1",
  "gpsoauth>=1.1.1",
  "requests>=2.32.3",
  "beautifulsoup4>=4.12.3",
  "pyscrypt>=1.6.2",
  "cryptography>=43.0.3",
  "pycryptodomex>=3.21.0",
  "ecdsa>=0.19.0",
  "pytz>=2024.2",
  "protobuf>=5.28.3",
  "httpx>=0.28.0",
  "h2>=4.1.0",
  "aiohttp>=3.11.8",
  "http_ece>=1.1.0",
  "setuptools>=75.6.0",
  "mcp>=2.2,<3",
]

[project.urls]
"Homepage" = "https://github.com/acamarata/findplus"
"Bug Tracker" = "https://github.com/acamarata/findplus/issues"
"Source" = "https://github.com/acamarata/findplus"

[project.optional-dependencies]
dev = [
  "pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5",
  "ruff>=0.8", "freezegun>=1.5", "playwright>=1.63",
  "build", "twine", "pyyaml", "shellcheck-py", "Pillow>=10",
]
apple = ["findmy>=0.10,<0.11"]
bundle = ["pyinstaller>=6.22,<7"]

[project.scripts]
findplus = "findplus.cli.main:main"

[project.entry-points."findplus.providers"]
# registered by E3-T2
google-find-hub = "findplus.providers.google_findhub.provider:GoogleFindHubProvider"
# registered by E11-T4
apple-find-my = "findplus.providers.apple_findmy.provider:AppleFindMyProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findplus"]

[tool.hatch.build.targets.wheel.force-include]
"vendor/GoogleFindMyTools" = "findplus/_vendor/GoogleFindMyTools"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src","vendor","tests","hatch_build.py","README.md","LICENSE","CHANGELOG.md"]
# .gitignore is dropped in hatch_build.py, not here: hatchling force-includes
# the VCS exclusion files, and force_include beats any `exclude` pattern.

[tool.hatch.build.targets.sdist.force-include]
"../CHANGELOG.md" = "CHANGELOG.md"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["vendor", "src/findplus/db/migrations/versions", "src/findplus/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "slow: builds/installs a wheel",
  "browser: needs Chrome",
  "posix_only: asserts exact POSIX mode bits (chmod/umask/uid) — auto-skipped on Windows, see conftest.py",
]
