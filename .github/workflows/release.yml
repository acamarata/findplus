name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --outdir dist cli
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/

  publish-pypi:
    needs: build-python
    # Owner decision 2026-09-25: Find+ is not published to PyPI (install.sh and
    # Homebrew install from the GitHub release). No trusted publisher exists, so
    # this job only failed. Set the repo variable PUBLISH_PYPI=true to turn it on.
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  build-dmg:
    needs: build-python
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon. Intel: `macos-13` (the label named
          # when this lane was scoped) no longer exists on GitHub-hosted
          # runners -- `actionlint` against this file lists the current
          # labels, and the free Intel image is now `macos-15-intel` (there
          # is also `macos-26-intel`; 15 is the more conservative pick).
          # The Intel leg is built for local testing only: the release job
          # attaches the signed aarch64 dmg alone (there is no Intel app).
          # Both are free for public repos (ASI Policy 8 — never pay
          # GitHub). Each leg builds its own sidecar and app natively — no
          # cross-compiled Python.
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-latest
            spec: packaging/pyinstaller/findplus-daemon.spec
            widget_arch: arm64
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            spec: packaging/pyinstaller/findplus-daemon-x86_64.spec
            widget_arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require signing on a tag run
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # A tag run must never produce an unsigned app. Fail here, before the
          # long build, instead of shipping an -UNSIGNED dmg.
          for v in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty. A tag run must be signed; add the APPLE_* secrets or cut the dmg locally."
              exit 1
            fi
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          # Without an arch-qualified key, the aarch64 and x86_64 legs would
          # share one cache key (same OS, same Cargo.lock) and clobber each
          # other's target/ output between runs.
          key: ${{ matrix.arch }}
      - run: pip install '.[dev,bundle,apple]'
        working-directory: cli
      - run: pyinstaller ${{ matrix.spec }} --noconfirm
      - name: Sign sidecar
        if: env.APPLE_CERTIFICATE_P12_BASE64 != ''
        run: |
          # A dedicated, unlocked keychain with an explicit partition list.
          # Importing into the default keychain with -A alone leaves the key
          # ACL asking for interactive approval, so every codesign in
          # sign-sidecar.sh and embed-widget.sh dies non-interactively with
          # errSecInternalComponent / "User interaction is not allowed". Only
          # the unsigned path had ever been exercised (packaging round 2 F3).
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/findplus-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          CERT="$RUNNER_TEMP/cert.p12"
          # Always remove the decoded key material, however this step ends.
          trap 'rm -f "$CERT"' EXIT
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 -d > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Put it on the search list so codesign resolves the identity by name.
          # An array, not a bare $(...), so a keychain path with a space still
          # reaches security as one argument (actionlint SC2046, loop2 C5).
          mapfile -t EXISTING_KEYCHAINS < <(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING_KEYCHAINS[@]}"
          security find-identity -v -p codesigning "$KEYCHAIN"

          bash packaging/scripts/sign-sidecar.sh
      - name: Install Tauri CLI
        run: |
          rustup target add ${{ matrix.target }}
          cargo install tauri-cli --version '^2.11' --locked
      - name: Build app and dmg
        run: |
          # Tauri's bundler reads APPLE_SIGNING_IDENTITY from the environment
          # directly; an empty-but-present var (job env resolves the unset
          # secret to "") makes it attempt an empty-identity codesign and
          # fail with "no identity found" instead of skipping signing.
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then unset APPLE_SIGNING_IDENTITY; fi
          cd desktop/src-tauri
          cargo tauri build --target ${{ matrix.target }}
      - name: Build widget (signed path only)
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          xcodebuild -project desktop/widget/FindPlusWidget.xcodeproj \
            -scheme FindPlusWidgetExtension -configuration Release -arch ${{ matrix.widget_arch }} build \
            -derivedDataPath desktop/widget/build ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
      - name: Embed widget, sign, notarise, rebuild dmg
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          APP_PATH="desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Find+.app"
          if [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            API_KEY_FILE=$(mktemp)
            trap 'rm -f "$API_KEY_FILE"' EXIT
            echo "$APPLE_API_KEY_P8_BASE64" | base64 -d > "$API_KEY_FILE"
            export APPLE_API_KEY="$API_KEY_FILE"
            export APPLE_API_ISSUER="$APPLE_API_ISSUER_ID"
          fi
          APP_PATH="$APP_PATH" ARCH_SUFFIX="${{ matrix.arch }}" bash packaging/scripts/embed-widget.sh
      - name: Rename dmg (unsigned path, no widget)
        if: env.APPLE_SIGNING_IDENTITY == ''
        run: |
          mkdir -p dist
          DMG=$(find desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name 'Find+_*.dmg' | head -1)
          cp "$DMG" "dist/FindPlus-unsigned.dmg"
      - name: Finalise artefact
        run: |
          VERSION=""
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VERSION" ]; then
            VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('cli/pyproject.toml','rb'))['project']['version'])")
          fi
          SUFFIX=""
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then SUFFIX="-UNSIGNED"; fi
          DMG=$(find dist -maxdepth 1 -name 'FindPlus-*.dmg' | head -1)
          cp "$DMG" "FindPlus-${VERSION}-${{ matrix.arch }}${SUFFIX}.dmg"
          shasum -a 256 "FindPlus-${VERSION}-${{ matrix.arch }}${SUFFIX}.dmg" > "FindPlus-${VERSION}-${{ matrix.arch }}${SUFFIX}.dmg.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Arch-qualified: the two matrix legs run concurrently and
          # upload-artifact rejects two uploads under the same name.
          name: macos-dmg-${{ matrix.arch }}
          path: |
            FindPlus-*.dmg
            FindPlus-*.dmg.sha256

  github-release:
    needs: [build-python, publish-pypi, build-dmg]
    if: always() && needs.build-python.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The repository's default workflow permission is read, so creating the
    # release needs this explicitly or action-gh-release fails with a 403.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for an existing published release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IS_DRAFT=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null || echo "absent")
          if [ "$IS_DRAFT" = "false" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.existing.outputs.skip != 'true'
        with:
          name: python-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.existing.outputs.skip != 'true'
        with:
          pattern: macos-dmg-*
          path: .
          merge-multiple: true
        continue-on-error: true
      - name: Bake the released version into install.sh
        if: steps.existing.outputs.skip != 'true'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sed -i "s|^VERSION_PIN=.*|VERSION_PIN=\"\${FINDPLUS_VERSION:-${TAG}}\"|" install.sh
          grep -n '^VERSION_PIN=' install.sh
      - name: Extract CHANGELOG section
        id: notes
        if: steps.existing.outputs.skip != 'true'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # A `/start/,/end/` awk range collapses to a single record when the
          # start line also matches the end pattern, which "## [x.y.z]" always
          # does. A flag is the only correct form here.
          BODY=$(awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { inblock = 1; next }
            inblock && /^## \[/ { exit }
            inblock { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then BODY="See CHANGELOG.md"; fi
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: steps.existing.outputs.skip != 'true'
        with:
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            install.sh
            packaging/scripts/update-app.sh
            FindPlus-*-aarch64.dmg
            FindPlus-*-aarch64.dmg.sha256
          draft: true
          fail_on_unmatched_files: false

  # Opens a PR (never a merge) on acamarata/homebrew-tap with the new formula. It runs
  # only for a tag, only once the release is published, and only when the repo secret
  # TAP_PUSH_TOKEN exists. See .github/wiki/Packaging-and-release.md.
  update-tap:
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/') && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # github-release creates the release as a DRAFT, and a draft release's
      # assets are not publicly downloadable — so the formula url the next step
      # writes would 404 for everyone until the owner publishes. Open the tap PR
      # only once the release is live (packaging round 2 F2).
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "open_pr=false" >> "$GITHUB_OUTPUT"
          if [ "$draft" = "true" ]; then
            echo "::notice::$GITHUB_REF_NAME is still a draft; skipping the tap PR."
            echo "Publish the release and re-run this job to open it."
          elif [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "::notice::TAP_PUSH_TOKEN is not set; skipping the tap PR."
          else
            echo "open_pr=true" >> "$GITHUB_OUTPUT"
          fi
      # Hash the sdist users will actually download: the one attached to the
      # release. When the release was cut locally first, github-release skips
      # and keeps those assets, so this run's own python-dist build is a
      # different tarball and its sha256 would break `brew install` (v1.1.0).
      - if: steps.release.outputs.open_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --pattern 'findplus-*.tar.gz' --dir dist
      - if: steps.release.outputs.open_pr == 'true'
        run: bash packaging/scripts/gen-formula.sh dist/findplus-*.tar.gz
      - if: steps.release.outputs.open_pr == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: acamarata/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: homebrew-tap
      - if: steps.release.outputs.open_pr == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp packaging/homebrew/findplus.rb homebrew-tap/Formula/findplus.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release-${VERSION}"
          git add Formula/findplus.rb
          git commit -m "findplus ${VERSION}"
          git push origin "release-${VERSION}"
          gh pr create --title "findplus ${VERSION}" --body "Automated release PR" --base main
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
