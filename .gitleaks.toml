title = "findplus gitleaks config"

# Extend the default ruleset; only add allowlist entries below.
[extend]
useDefault = true

[[allowlists]]
description = "Known false positives, reviewed 2026-09-19"
regexTarget = "match"

# GoogleFindMyTools (vendored, never modified per PRI hard rule 8) ships a
# public Firebase Cloud Messaging sender key used by its FCM registration
# flow. Firebase/FCM client keys are designed to be embedded in clients and
# are not treated as secrets by Google; restriction happens server-side.
# This key is part of the upstream GPL-3.0 project, unchanged since vendoring.
# Matched by path across history: pre-E1 commits have it at
# vendor/GoogleFindMyTools/..., post-E1 at cli/vendor/GoogleFindMyTools/....
paths = [
  '''(^|/)vendor/GoogleFindMyTools/Auth/fcm_receiver\.py$''',
]

# generic-api-key false positives: these are option/variable NAMES
# ("--private-key", "private_key_b64"), not secret values.
regexes = [
  '''--private-key.*private_key_b64''',
  '''private_key_b64=private_key_b64''',
]

# Reviewed 2026-10-01: the remaining seven generic-api-key hits are not secrets.
[[allowlists]]
description = "Public extension key and fake test fixtures"
targetRules = ["generic-api-key"]
paths = [
  # Chrome extension PUBLIC key: pins the unpacked helper's extension id.
  '''^browser-helper/manifest\.json$''',
  # Made-up values for the Apple and WhatsApp fixtures; no network, no account.
  '''^cli/tests/providers/test_apple_auth\.py$''',
  '''^cli/tests/ui/test_alerts_whatsapp\.py$''',
]
