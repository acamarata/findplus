name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --outdir dist cli
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  publish-pypi:
    needs: build-python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  build-dmg:
    needs: build-python
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: pip install '.[dev,bundle]'
        working-directory: cli
      - run: pyinstaller packaging/pyinstaller/findplus-daemon.spec --noconfirm
      - name: Sign sidecar
        if: env.APPLE_CERTIFICATE_P12_BASE64 != ''
        run: |
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 -d > /tmp/cert.p12
          security import /tmp/cert.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A
          bash packaging/scripts/sign-sidecar.sh
      - name: Install Tauri CLI
        run: |
          rustup target add aarch64-apple-darwin
          cargo install tauri-cli --version '^2.11' --locked
      - name: Build app and dmg
        run: |
          # Tauri's bundler reads APPLE_SIGNING_IDENTITY from the environment
          # directly; an empty-but-present var (job env resolves the unset
          # secret to "") makes it attempt an empty-identity codesign and
          # fail with "no identity found" instead of skipping signing.
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then unset APPLE_SIGNING_IDENTITY; fi
          cd desktop/src-tauri
          cargo tauri build --target aarch64-apple-darwin
      - name: Build widget (signed path only)
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          xcodebuild -project desktop/widget/FindPlusWidget.xcodeproj \
            -scheme FindPlusWidgetExtension -configuration Release -arch arm64 build \
            -derivedDataPath desktop/widget/build ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
      - name: Embed widget, sign, notarise, rebuild dmg
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          APP_PATH="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Find+.app"
          if [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            echo "$APPLE_API_KEY_P8_BASE64" | base64 -d > /tmp/api-key.p8
            export APPLE_API_KEY=/tmp/api-key.p8
            export APPLE_API_ISSUER="$APPLE_API_ISSUER_ID"
          fi
          APP_PATH="$APP_PATH" bash packaging/scripts/embed-widget.sh
      - name: Rename dmg (unsigned path, no widget)
        if: env.APPLE_SIGNING_IDENTITY == ''
        run: |
          mkdir -p dist
          DMG=$(find desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name 'Find+_*.dmg' | head -1)
          cp "$DMG" "dist/FindPlus-unsigned.dmg"
      - name: Finalise artefact
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
          if [ -z "$VERSION" ]; then
            VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('cli/pyproject.toml','rb'))['project']['version'])")
          fi
          SUFFIX=""
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then SUFFIX="-UNSIGNED"; fi
          DMG=$(find dist -maxdepth 1 -name 'FindPlus-*.dmg' | head -1)
          cp "$DMG" "FindPlus-${VERSION}-aarch64${SUFFIX}.dmg"
          shasum -a 256 "FindPlus-${VERSION}-aarch64${SUFFIX}.dmg" > "FindPlus-${VERSION}-aarch64${SUFFIX}.dmg.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            FindPlus-*.dmg
            FindPlus-*.dmg.sha256

  github-release:
    needs: [build-python, publish-pypi, build-dmg]
    if: always() && needs.build-python.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The repository's default workflow permission is read, so creating the
    # release needs this explicitly or action-gh-release fails with a 403.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check for an existing published release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IS_DRAFT=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null || echo "absent")
          if [ "$IS_DRAFT" = "false" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.existing.outputs.skip != 'true'
        with:
          name: python-dist
          path: dist
      - uses: actions/download-artifact@v8
        if: steps.existing.outputs.skip != 'true'
        with:
          name: macos-dmg
          path: .
        continue-on-error: true
      - name: Bake the released version into install.sh
        if: steps.existing.outputs.skip != 'true'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sed -i "s|^VERSION_PIN=.*|VERSION_PIN=\"\${FINDPLUS_VERSION:-${TAG}}\"|" install.sh
          grep -n '^VERSION_PIN=' install.sh
      - name: Extract CHANGELOG section
        id: notes
        if: steps.existing.outputs.skip != 'true'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # A `/start/,/end/` awk range collapses to a single record when the
          # start line also matches the end pattern, which "## [x.y.z]" always
          # does. A flag is the only correct form here.
          BODY=$(awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { inblock = 1; next }
            inblock && /^## \[/ { exit }
            inblock { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then BODY="See CHANGELOG.md"; fi
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        if: steps.existing.outputs.skip != 'true'
        with:
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            install.sh
            FindPlus-*.dmg
            FindPlus-*.dmg.sha256
          draft: true
          fail_on_unmatched_files: false

  update-tap:
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/') && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - run: bash packaging/scripts/gen-formula.sh dist/findplus-*.tar.gz
      - uses: actions/checkout@v4
        with:
          repository: acamarata/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: homebrew-tap
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp packaging/homebrew/findplus.rb homebrew-tap/Formula/findplus.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release-${VERSION}"
          git add Formula/findplus.rb
          git commit -m "findplus ${VERSION}"
          git push origin "release-${VERSION}"
          gh pr create --title "findplus ${VERSION}" --body "Automated release PR" --base main
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
