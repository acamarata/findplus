name: Bug report
description: Report incorrect behaviour
labels: ["bug"]
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: Optional, for follow-up.
  - type: input
    id: version
    attributes:
      label: Find+ version
      description: Output of `findplus --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS 15+
        - Ubuntu 24.04
        - Ubuntu 22.04
        - Windows 11
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant log lines from ~/.findplus/findplus.log
    validations:
      required: false
