<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Find+</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <div class="splash">
      <div class="logo">Find+</div>
      <div class="status" id="status">Starting Find+…</div>
      <div class="spinner" id="spinner" aria-hidden="true"></div>
      <div class="error hidden" id="error">
        <p>This can take up to a minute after an update. If it stays here, quit Find+ from the menu bar and open it again.</p>
      </div>
    </div>
  </body>
</html>
